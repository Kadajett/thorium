name: Android developer prerelease

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: android-developer-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build developer APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks
        run: pnpm check

      - name: Test, lint, and build Android debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify debug signature and create checksum
        env:
          APK_PATH: apps/android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/thorium-developer-debug.apk
          cd artifacts
          sha256sum thorium-developer-debug.apk > thorium-developer-debug.apk.sha256
          sha256sum --check thorium-developer-debug.apk.sha256

      - name: Upload developer APK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thorium-android-developer-${{ github.run_id }}
          path: |
            artifacts/thorium-developer-debug.apk
            artifacts/thorium-developer-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  prerelease:
    name: Publish developer-only prerelease
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified developer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thorium-android-developer-${{ github.run_id }}
          path: release-artifacts

      - name: Create developer-only GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/thorium-release-notes.md" <<EOF
          Developer-only Android prerelease.

          This APK is signed with the GitHub Actions runner's Android debug key. It is not production-signed, is not a Play Store release, and is intended only for sideload testing. A later workflow run may use a different debug key, requiring the previous developer build to be uninstalled before installation.

          Thorium is heavily AI-assisted and human-directed and reviewed: the architecture, product decisions, constraints, testing, and acceptance remain under human control. See the repository's [AI-assisted development](https://github.com/$GITHUB_REPOSITORY#ai-assisted-development) disclosure.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "release-artifacts/thorium-developer-debug.apk#Developer-only Android debug APK" \
            "release-artifacts/thorium-developer-debug.apk.sha256#SHA-256 checksum" \
            --verify-tag \
            --prerelease \
            --title "Thorium $GITHUB_REF_NAME developer prerelease" \
            --notes-file "$RUNNER_TEMP/thorium-release-notes.md"
