name: Android manual Thor test prerelease

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: APK version tag for this explicitly requested manual-test prerelease
        required: true
        default: android-v0.1.0-dev.10
      acknowledge_unverified:
        description: Publish for manual testing despite documented quality and device-performance failures
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-manual-test-release
  cancel-in-progress: false

jobs:
  manual-test:
    if: inputs.acknowledge_unverified
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/android/**/*.gradle.kts
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Prepare existing stable developer signing key
        env:
          THORIUM_ANDROID_KEYSTORE_BASE64: ${{ secrets.THORIUM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$THORIUM_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$THORIUM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thorium-developer.jks"
          echo "THORIUM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/thorium-developer.jks" >> "$GITHUB_ENV"
      - name: Test, lint and build the native APK
        working-directory: apps/android
        env:
          THORIUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.THORIUM_ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify unchanged signer and create update assets
        env:
          THORIUM_ANDROID_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk artifacts/thorium-developer-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifacts/thorium-developer-debug.apk | tee "$RUNNER_TEMP/thorium-signature.txt"
          grep -Fx 'Signer #1 certificate SHA-256 digest: e70b0874b3d49332a0f82cfdf6e89d81458c40008faa2816b1797963e50a7de9' "$RUNNER_TEMP/thorium-signature.txt"
          node --test tools/android-update/manifest.test.mts
          node tools/android-update/generate.mts artifacts/thorium-developer-debug.apk artifacts/thorium-android-update.json
          cd artifacts
          sha256sum thorium-developer-debug.apk > thorium-developer-debug.apk.sha256
          sha256sum --check thorium-developer-debug.apk.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: thorium-manual-test-${{ github.run_id }}
          path: artifacts/*
          if-no-files-found: error
      - name: Publish explicitly unverified developer prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THORIUM_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$THORIUM_RELEASE_TAG" \
            artifacts/thorium-developer-debug.apk \
            artifacts/thorium-developer-debug.apk.sha256 \
            artifacts/thorium-android-update.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "Thorium $THORIUM_RELEASE_TAG — manual Thor test" \
            --notes-file docs/android-dev10-manual-test.md
